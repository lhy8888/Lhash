name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze-csharp:
    name: Analyze C# surface
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Analyze
        uses: github/codeql-action/analyze@v3

# Note:
# CodeQL is temporarily restricted to manual execution while the repository's
# mixed native and managed build surfaces are being aligned for more reliable
# automated scanning. This avoids repeated noise on normal development pushes.
