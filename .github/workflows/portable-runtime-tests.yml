name: Portable Runtime Tests

on:
  workflow_dispatch:
  push:
    branches:
      - future-winui-was2
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  provider-and-queue:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Core and desktop workflows also use hosted Apple Silicon runners.
      # Avoid requesting three more macOS runners at once: allocation failures
      # have cancelled queued jobs before any test could execute.
      max-parallel: 1
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            sanitizer: false
            assembly_mode: optimized
          - name: linux-x64-sanitizers
            os: ubuntu-24.04
            sanitizer: true
            assembly_mode: optimized
          - name: macos-arm64
            os: macos-14
            sanitizer: false
            assembly_mode: optimized
          - name: macos-arm64-sanitizers
            os: macos-14
            sanitizer: true
            assembly_mode: optimized
          - name: linux-x64-portable
            os: ubuntu-24.04
            sanitizer: false
            assembly_mode: portable
          - name: macos-arm64-portable
            os: macos-14
            sanitizer: false
            assembly_mode: portable
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET for source-contract checks
        if: matrix.name == 'linux-x64'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Check source contracts on Linux
        if: matrix.name == 'linux-x64'
        run: |
          dotnet test unit-tests/LHash.UnitTests/LHash.UnitTests.csproj --configuration Release
          dotnet run --project security-tests/SecurityRegression/SecurityRegression.csproj --configuration Release

      - name: Verify optimized and portable Configure contracts
        if: matrix.name == 'linux-x64'
        run: python3 tests/openssl-build/test_configuration.py

      - name: Configure test environment
        run: |
          mkdir -p artifacts/portable
          echo "OPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/build/openssl-install" >> "$GITHUB_ENV"
          if [[ '${{ matrix.sanitizer }}' == 'true' ]]; then
            echo 'CFLAGS=-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' >> "$GITHUB_ENV"
            echo 'CXXFLAGS=-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' >> "$GITHUB_ENV"
            echo 'LDFLAGS=-fsanitize=address,undefined' >> "$GITHUB_ENV"
          fi

      - name: Verify pristine OpenSSL source
        run: pwsh -NoProfile -File tools/verify_openssl_vendor_pristine.ps1 -Version 3.5.9

      - name: Cache static OpenSSL
        id: openssl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/openssl-install
          key: openssl-3.5.9-${{ matrix.name }}-${{ matrix.assembly_mode }}-${{ hashFiles('third_party/openssl/3.5.9/**', 'third_party/openssl/OPENSSL_3_5_9_FILES.sha256', 'tools/build_openssl_vendor_posix.sh', 'tools/verify_openssl_build_config.pl', 'tools/verify_openssl_install.py', '.github/workflows/portable-runtime-tests.yml') }}

      - name: Build vendored OpenSSL 3.5.9
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash tools/build_openssl_vendor_posix.sh "$OPENSSL_ROOT_DIR" '${{ matrix.assembly_mode }}' 2>&1 | tee artifacts/portable/openssl-build.log

      - name: Verify restored or built OpenSSL assembly configuration
        run: |
          target=linux-x86_64
          if [[ "$RUNNER_OS" == 'macOS' ]]; then target=darwin64-arm64-cc; fi
          python3 tools/verify_openssl_install.py "$OPENSSL_ROOT_DIR" '${{ matrix.assembly_mode }}' "$target"
          cp "$OPENSSL_ROOT_DIR/lhash-openssl-build-config.json" artifacts/portable/

      - name: Build and run provider and queue regressions
        run: |
          set -o pipefail
          architecture_args=()
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            architecture_args=(-DCMAKE_OSX_ARCHITECTURES=arm64)
          fi
          for suite in openssl-provider digest_queue; do
            cmake -S "tests/$suite" -B "build/$suite" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              "${architecture_args[@]}" -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" 2>&1 | tee "artifacts/portable/$suite-configure.log"
            cmake --build "build/$suite" --parallel 3 2>&1 | tee "artifacts/portable/$suite-build.log"
            ctest --test-dir "build/$suite" -V --output-on-failure --no-tests=error \
              --output-junit "$GITHUB_WORKSPACE/artifacts/portable/$suite.xml" 2>&1 | tee "artifacts/portable/$suite-tests.log"
          done

      - name: Test optimized library with optional CPU features masked
        if: matrix.assembly_mode == 'optimized'
        run: |
          set -o pipefail
          capability=OPENSSL_ia32cap=0:0
          if [[ "$RUNNER_OS" == 'macOS' ]]; then capability=OPENSSL_armcap=0; fi
          env "$capability" ctest --test-dir build/openssl-provider -V --output-on-failure --no-tests=error \
            --output-junit "$GITHUB_WORKSPACE/artifacts/portable/provider-baseline.xml" 2>&1 | tee artifacts/portable/provider-baseline.log

      - name: Run full engine and CLI regressions with OpenSSL
        run: |
          set -o pipefail
          platform_args=()
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            platform_args=(-DCMAKE_OSX_ARCHITECTURES=arm64)
          else
            platform_args=(-DLHASH_ENABLE_POSIX_TEST_BACKEND=ON)
          fi
          cmake -S . -B build/runtime -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "${platform_args[@]}" \
            -DLHASH_BUILD_M2_SMOKE=ON -DLHASH_BUILD_RUNTIME_TESTS=ON -DLHASH_BUILD_CLI=ON \
            -DLHASH_ENABLE_OPENSSL_VENDOR=ON -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" 2>&1 | tee artifacts/portable/engine-configure.log
          cmake --build build/runtime --parallel 3 2>&1 | tee artifacts/portable/engine-build.log
          ctest --test-dir build/runtime -V --output-on-failure --no-tests=error \
            --output-junit "$GITHUB_WORKSPACE/artifacts/portable/engine.xml" 2>&1 | tee artifacts/portable/engine-tests.log

      - name: Annotate test failures
        if: failure()
        run: python3 tools/report_ci_failures.py "artifacts/portable"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-tests-${{ matrix.name }}
          path: artifacts/portable/**
          if-no-files-found: error
