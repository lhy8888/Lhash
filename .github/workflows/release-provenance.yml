name: Re-attest Published Release Assets

# Normal releases generate their checksummed SBOM and attestations before
# publication in windows-build.yml. Recovery never rewrites published assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and re-attest
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-release-assets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download and verify immutable release assets
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          gh release download --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern 'LHash-windows-*.zip' --pattern 'LHash-macos-arm64-cli-*.tar.gz' \
            --pattern RELEASE_MANIFEST.txt \
            --pattern SHA256SUMS.txt --pattern LHash-release.cyclonedx.json -- "$RELEASE_TAG"
          python3 tools/release_assets.py verify --directory release-assets
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Re-attest verified published files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release-assets/LHash-windows-*.zip
            release-assets/LHash-macos-arm64-cli-*.tar.gz
            release-assets/RELEASE_MANIFEST.txt
            release-assets/SHA256SUMS.txt
            release-assets/LHash-release.cyclonedx.json
