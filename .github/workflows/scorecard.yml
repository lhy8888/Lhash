name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches:
      - future-winui-was2
  workflow_dispatch:

permissions:
  security-events: write
  id-token: write
  contents: read
  actions: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.3.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

# Note:
# This workflow gives the repository a repeatable OpenSSF security baseline check.
# Findings are surfaced through GitHub code scanning so the project can track and
# improve supply-chain posture over time rather than relying on a one-time review.
