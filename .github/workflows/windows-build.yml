      - name: Upload Windows ARM64 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LHash-windows-arm64
          path: |
            artifacts/build-openssl-vendor-arm64.log
            artifacts/openssl-vendor-arm64/*.log
            artifacts/build-windows-arm64.log
            artifacts/windows-arm64-*
            artifacts/LHash-windows-arm64-*.zip
          if-no-files-found: warn

  publish-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-x64
      - build-windows-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: LHash-windows-*
          path: release-assets
          merge-multiple: true

      - name: Stage release rehearsal bundle
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="$PWD/release-assets"
          staging_root="$PWD/release-staging"
          mkdir -p "$staging_root"

          if ! compgen -G "$artifact_root/LHash-windows-x64-*.zip" > /dev/null; then
            echo "Expected packaged lightweight native release zip was not downloaded into release-assets." >&2
            exit 1
          fi
          if ! compgen -G "$artifact_root/LHash-windows-arm64-*.zip" > /dev/null; then
            echo "Expected packaged Windows ARM64 release zip was not downloaded into release-assets." >&2
            exit 1
          fi

          version_header="trunk/source/WinMFC/version.h"
          version_rc2="trunk/source/WinMFC/fileshash.rc2"
          app_version=$(grep -oP '(?<=LHASH_VERSION_STRING\s")[^"]+' "$version_header" \
                        || grep -oP '(?<=STR_VERSION_LEGACY\s")[^"]+' "$version_header" \
                        || grep -oP '(?<="FileVersion", ")[^"]+' "$version_rc2" \
                        || echo "unknown")
          short_sha="${GITHUB_SHA::7}"
          release_mode="rehearsal"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_mode="tagged-release"
          fi

          cat > "$staging_root/RELEASE_MANIFEST.txt" <<EOF
          release_mode=$release_mode
          ref=$GITHUB_REF
          commit=$GITHUB_SHA
          short_sha=$short_sha
          lhash_application_version=$app_version
          frontend=windows-mfc
          openssl_vendor_version=3.5.6
          openssl_vendor_source=third_party/openssl/3.5.6
          openssl_vendor_static=true
          openssl_vendor_policy=pristine-upstream-source
          openssl_vendor_local_patches=none
          workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          windows_x64=$(basename $(ls "$artifact_root"/LHash-windows-x64-*.zip | head -n 1))
          windows_arm64=$(basename $(ls "$artifact_root"/LHash-windows-arm64-*.zip | head -n 1))
          EOF

          cp "$artifact_root"/LHash-windows-x64-*.zip "$staging_root"/
          cp "$artifact_root"/LHash-windows-arm64-*.zip "$staging_root"/
          find "$artifact_root" -maxdepth 1 -type f \( -name '*.log' -o -name '*.txt' \) -exec cp {} "$staging_root"/ \;
          (
            cd "$staging_root"
            shasum -a 256 LHash-windows-x64-*.zip LHash-windows-arm64-*.zip > SHA256SUMS.txt
          )
          tar -czf "$PWD/LHash-release-rehearsal-$short_sha.tar.gz" -C "$staging_root" .

      - name: Upload release rehearsal artifact
        uses: actions/upload-artifact@v7
        with:
          name: LHash-release-rehearsal
          path: |
            release-staging/RELEASE_MANIFEST.txt
            release-staging/SHA256SUMS.txt
            LHash-release-rehearsal-*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LHash ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/LHash-windows-x64-*.zip
            release-assets/LHash-windows-arm64-*.zip
            release-staging/RELEASE_MANIFEST.txt
            release-staging/SHA256SUMS.txt
