name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/security-hardening
    tags:
      - v*
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-regression:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build security regression harness
        run: dotnet build security-tests/SecurityRegression/SecurityRegression.csproj --configuration Release

      - name: Run security regression harness
        run: dotnet security-tests/SecurityRegression/bin/Release/net10.0/SecurityRegression.dll

  build-legacy-x64:
    needs: security-regression
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show Visual Studio toolchain info
        shell: powershell
        run: |
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Unable to locate vswhere.exe on the runner.'
          }

          & $vswhere -latest -products * -format json
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -ErrorAction SilentlyContinue

      - name: Build legacy Windows app
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $logPath = Join-Path $artifactRoot 'build-legacy-x64.log'

          & msbuild trunk/fileshash.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE. See artifacts/build-legacy-x64.log for details."
          }

          $exeCandidates = @(
            'trunk\x64\Release\fHash64.exe',
            'trunk\x64\Release\fHash.exe'
          )
          $builtExe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $builtExe) {
            throw 'MSBuild succeeded, but no executable was found in trunk\\x64\\Release.'
          }

      - name: Package legacy x64 build
        if: always()
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $bundleRoot = Join-Path $artifactRoot 'legacy-x64'
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          $exeCandidates = @(
            'trunk\x64\Release\fHash64.exe',
            'trunk\x64\Release\fHash.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($exePath) {
            Copy-Item $exePath -Destination (Join-Path $bundleRoot 'fHash.exe') -ErrorAction Stop
            $readme = @"
          fHash legacy x64 build

          Files:
          - fHash.exe: desktop application

          Usage:
          - Double-click fHash.exe to run the app.
          - Shell extension packaging is intentionally skipped in CI.
          "@
          }
          else {
            $readme = @"
          fHash legacy x64 build

          The executable was not produced in this CI run.
          See build-legacy-x64.log in the artifact root for the full MSBuild output.
          "@
          }

          Set-Content -Path (Join-Path $bundleRoot 'README.txt') -Value $readme -Encoding ASCII

          if ($exePath) {
            Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath (Join-Path $artifactRoot 'fHash-legacy-x64.zip') -Force
          }

      - name: Upload legacy x64 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fHash-legacy-x64
          path: |
            artifacts/build-legacy-x64.log
            artifacts/legacy-x64
            artifacts/fHash-legacy-x64.zip
          if-no-files-found: warn

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-legacy-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download legacy x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fHash-legacy-x64
          path: release-assets

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/fHash-legacy-x64.zip
