name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - future-winui-was2
      - codex/openssl-3.5.9-vendor
    tags:
      - v*
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-regression:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Build security regression harness
        run: dotnet build security-tests/SecurityRegression/SecurityRegression.csproj --configuration Release

      - name: Run security regression harness
        run: dotnet security-tests/SecurityRegression/bin/Release/net10.0/SecurityRegression.dll

  unit-tests:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore unit test project
        run: dotnet restore unit-tests/LHash.UnitTests/LHash.UnitTests.csproj

      - name: Run unit tests
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          & dotnet test unit-tests/LHash.UnitTests/LHash.UnitTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=LHash.UnitTests.trx" --results-directory $artifactRoot

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test failed with exit code $LASTEXITCODE. See artifacts/LHash.UnitTests.trx for details."
          }

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-unit-tests
          path: |
            artifacts/LHash.UnitTests.trx
          if-no-files-found: warn

  prepare-openssl-vendor-x64:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify pristine OpenSSL vendor source
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'tools/verify_openssl_vendor_pristine.ps1' -Version 3.5.9

      - name: Restore cached OpenSSL vendor x64
        id: restore-openssl-vendor-x64-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/openssl-vendor-x64
          key: ${{ runner.os }}-openssl-vendor-x64-optimized-v3-${{ hashFiles('third_party/openssl/3.5.9/**', 'tools/verify_openssl_vendor_pristine.ps1', 'third_party/openssl/OPENSSL_3_5_9_FILES.sha256', 'trunk/build_openssl_vendor.ps1', 'tools/verify_openssl_build_config.pl', 'tools/verify_openssl_install.py', 'NativeOpenSslVendor.targets') }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Prepare OpenSSL x64 assembler
        uses: ./.github/actions/setup-openssl-assembler
        with:
          platform: x64

      - name: Build OpenSSL vendor x64 once
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $openSslLogPath = Join-Path $artifactRoot 'build-openssl-vendor-x64.log'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-x64'

          & pwsh -NoProfile -File 'trunk/build_openssl_vendor.ps1' -Platform x64 -AssemblyMode optimized -InstallRoot $openSslRoot -CombinedLogPath $openSslLogPath 2>&1 |
            Tee-Object -FilePath (Join-Path $artifactRoot 'build-openssl-vendor-x64-console.log')

          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL vendor build failed. See artifacts/build-openssl-vendor-x64.log for details."
          }

      - name: Verify optimized OpenSSL x64 build metadata
        shell: pwsh
        run: python tools/verify_openssl_install.py artifacts/openssl-vendor-x64 optimized VC-WIN64A

      - name: Annotate OpenSSL build failures
        if: failure()
        shell: pwsh
        run: python tools/report_ci_failures.py artifacts

      - name: Upload OpenSSL vendor x64 artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-openssl-vendor-x64
          path: |
            artifacts/build-openssl-vendor-x64*.log
            artifacts/openssl-vendor-x64/**
          if-no-files-found: warn

  native-runtime-tests:
    needs:
      - security-regression
      - unit-tests
      - prepare-openssl-vendor-x64
      - prepare-openssl-vendor-arm64
    name: Native runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            os: windows-2022
            toolset: v143
            generator: Visual Studio 17 2022
            artifact_arch: x64
            executable: native-runtime-tests\LHash.NativeRuntimeTests\x64\Release\LHash.NativeRuntimeTests.exe
          - platform: ARM64
            os: windows-11-arm
            toolset: v145
            generator: Visual Studio 18 2026
            artifact_arch: arm64
            executable: native-runtime-tests\LHash.NativeRuntimeTests\ARM64\Release\LHash.NativeRuntimeTests.exe
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: ${{ matrix.artifact_arch }}

      - name: Download prepared OpenSSL vendor artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: LHash-openssl-vendor-${{ matrix.artifact_arch }}
          path: artifacts

      - name: Build and run native runtime tests
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $buildLogPath = Join-Path $artifactRoot 'build-native-runtime-tests-${{ matrix.artifact_arch }}.log'
          $runLogPath = Join-Path $artifactRoot 'run-native-runtime-tests-${{ matrix.artifact_arch }}.log'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-${{ matrix.artifact_arch }}'
          if (-not (Test-Path (Join-Path $openSslRoot 'lib/libcrypto.lib'))) {
            throw 'Prepared OpenSSL static library is missing.'
          }
          & msbuild native-runtime-tests/LHash.NativeRuntimeTests/LHash.NativeRuntimeTests.vcxproj /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=${{ matrix.toolset }} /p:BuildProjectReferences=true /p:LHashOpenSslInstallRoot=$openSslRoot 2>&1 |
            Tee-Object -FilePath $buildLogPath
          if ($LASTEXITCODE -ne 0) { throw "Native build failed; see $buildLogPath" }
          $exePath = '${{ matrix.executable }}'
          if (-not (Test-Path $exePath)) { throw "Missing test executable: $exePath" }
          & $exePath --expected-architecture ${{ matrix.platform }} --require-openssl 2>&1 | Tee-Object -FilePath $runLogPath
          if ($LASTEXITCODE -ne 0) { throw "Native runtime tests failed; see $runLogPath" }
          Get-Content $runLogPath | Select-Object -Last 1 | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Test OpenSSL provider and digest queue
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-${{ matrix.artifact_arch }}'
          foreach ($suite in @('openssl-provider', 'digest_queue')) {
            $buildRoot = Join-Path $pwd "build/$suite"
            & cmake -S "tests/$suite" -B $buildRoot -G '${{ matrix.generator }}' -A '${{ matrix.platform }}' "-DOPENSSL_ROOT_DIR=$openSslRoot" 2>&1 |
              Tee-Object -FilePath (Join-Path $artifactRoot "$suite-configure.log")
            if ($LASTEXITCODE -ne 0) { throw "$suite configure failed" }
            & cmake --build $buildRoot --config Release --parallel 2>&1 |
              Tee-Object -FilePath (Join-Path $artifactRoot "$suite-build.log")
            if ($LASTEXITCODE -ne 0) { throw "$suite build failed" }
            & ctest --test-dir $buildRoot -C Release -V --output-on-failure --no-tests=error --output-junit (Join-Path $artifactRoot "$suite.xml") 2>&1 |
              Tee-Object -FilePath (Join-Path $artifactRoot "$suite-tests.log")
            if ($LASTEXITCODE -ne 0) { throw "$suite tests failed" }
          }

      - name: Test optimized x64 library with optional CPU features masked
        if: matrix.platform == 'x64'
        run: |
          $env:OPENSSL_ia32cap = '0:0'
          try {
            ctest --test-dir build/openssl-provider -C Release -V --output-on-failure --no-tests=error --output-junit "$pwd/artifacts/provider-baseline.xml" 2>&1 | Tee-Object artifacts/provider-baseline.log
            if ($LASTEXITCODE -ne 0) { throw 'Baseline CPU dispatch tests failed.' }
          } finally {
            Remove-Item Env:OPENSSL_ia32cap
          }

      - name: Run full core and platform regressions with OpenSSL
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-${{ matrix.artifact_arch }}'
          $buildRoot = Join-Path $pwd 'build/full-runtime'
          & cmake -S . -B $buildRoot -G '${{ matrix.generator }}' -A '${{ matrix.platform }}' -DLHASH_BUILD_M2_SMOKE=ON -DLHASH_BUILD_RUNTIME_TESTS=ON -DLHASH_BUILD_CLI=OFF -DLHASH_ENABLE_OPENSSL_VENDOR=ON "-DOPENSSL_ROOT_DIR=$openSslRoot" 2>&1 |
            Tee-Object -FilePath (Join-Path $artifactRoot 'full-runtime-configure.log')
          if ($LASTEXITCODE -ne 0) { throw 'Full runtime configure failed.' }
          & cmake --build $buildRoot --config Release --parallel 2>&1 |
            Tee-Object -FilePath (Join-Path $artifactRoot 'full-runtime-build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Full runtime build failed.' }
          & ctest --test-dir $buildRoot -C Release -V --output-on-failure --no-tests=error --output-junit (Join-Path $artifactRoot 'full-runtime.xml') 2>&1 |
            Tee-Object -FilePath (Join-Path $artifactRoot 'full-runtime-tests.log')
          if ($LASTEXITCODE -ne 0) { throw 'Full runtime tests failed.' }

      - name: Annotate test failures
        if: failure()
        run: python tools/report_ci_failures.py "artifacts"

      - name: Upload native runtime test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-native-runtime-tests-${{ matrix.artifact_arch }}
          path: |
            artifacts/*.log
            artifacts/*.xml
          if-no-files-found: error

  portable-openssl-tests:
    name: Portable OpenSSL (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            os: windows-2022
            generator: Visual Studio 17 2022
            target: VC-WIN64A
          - platform: ARM64
            os: windows-11-arm
            generator: Visual Studio 18 2026
            target: VC-WIN64-ARM
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify pristine OpenSSL vendor source
        run: pwsh -NoProfile -File tools/verify_openssl_vendor_pristine.ps1 -Version 3.5.9

      - name: Cache portable dependency separately from release artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/openssl-portable
          key: ${{ runner.os }}-openssl-vendor-${{ matrix.platform }}-portable-v3-${{ hashFiles('third_party/openssl/3.5.9/**', 'tools/verify_openssl_vendor_pristine.ps1', 'third_party/openssl/OPENSSL_3_5_9_FILES.sha256', 'trunk/build_openssl_vendor.ps1', 'tools/verify_openssl_build_config.pl', 'tools/verify_openssl_install.py', 'NativeOpenSslVendor.targets') }}

      - name: Build and verify portable OpenSSL
        run: |
          $root = Join-Path $pwd 'artifacts/openssl-portable'
          pwsh -NoProfile -File trunk/build_openssl_vendor.ps1 -Platform '${{ matrix.platform }}' -AssemblyMode portable -InstallRoot $root
          if ($LASTEXITCODE -ne 0) { throw 'Portable OpenSSL build failed.' }
          python tools/verify_openssl_install.py $root portable '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'Portable OpenSSL configuration mismatch.' }

      - name: Run full native core regressions against portable OpenSSL
        run: |
          $root = Join-Path $pwd 'artifacts/openssl-portable'
          New-Item -ItemType Directory -Force artifacts/portable-runtime | Out-Null
          cmake -S . -B build/portable-runtime -G '${{ matrix.generator }}' -A '${{ matrix.platform }}' -DLHASH_BUILD_M2_SMOKE=ON -DLHASH_BUILD_RUNTIME_TESTS=ON -DLHASH_BUILD_CLI=OFF -DLHASH_ENABLE_OPENSSL_VENDOR=ON "-DOPENSSL_ROOT_DIR=$root" 2>&1 | Tee-Object artifacts/portable-runtime/configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime configure failed.' }
          cmake --build build/portable-runtime --config Release --parallel 2>&1 | Tee-Object artifacts/portable-runtime/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime build failed.' }
          ctest --test-dir build/portable-runtime -C Release -V --output-on-failure --no-tests=error --output-junit "$pwd/artifacts/portable-runtime/tests.xml" 2>&1 | Tee-Object artifacts/portable-runtime/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime tests failed.' }

      - name: Annotate portable test failures
        if: failure()
        run: python tools/report_ci_failures.py artifacts

      - name: Upload portable regression diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-portable-openssl-${{ matrix.platform }}
          path: |
            artifacts/portable-runtime/**
            artifacts/openssl-portable/*.log
            artifacts/openssl-portable/lhash-openssl-build-config.json
          if-no-files-found: error

  build-windows-x64:
    needs:
      - security-regression
      - unit-tests
      - prepare-openssl-vendor-x64
    runs-on: windows-2022
    env:
      LHASH_SIGN_PFX_BASE64: ${{ secrets.LHASH_SIGN_PFX_BASE64 }}
      LHASH_SIGN_PFX_PASSWORD: ${{ secrets.LHASH_SIGN_PFX_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Download OpenSSL vendor x64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: LHash-openssl-vendor-x64
          path: artifacts

      - name: Show Visual Studio toolchain info
        shell: powershell
        run: |
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Unable to locate vswhere.exe on the runner.'
          }

          & $vswhere -latest -products * -format json
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -ErrorAction SilentlyContinue

      - name: Build Windows MFC app
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $logPath = Join-Path $artifactRoot 'build-windows-x64.log'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-x64'
          if (-not (Test-Path (Join-Path $openSslRoot 'lib\\libcrypto.lib'))) {
            throw 'Expected the prepared OpenSSL vendor artifact to contain lib\\libcrypto.lib.'
          }

          & msbuild trunk/fileshash15.sln /m /t:LHash /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:LHashOpenSslInstallRoot=$openSslRoot 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE. See artifacts/build-windows-x64.log for details."
          }

          $exeCandidates = @(
            'trunk\x64\Release\LHash.exe'
          )
          $builtExe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $builtExe) {
            throw 'MSBuild succeeded, but no executable was found in trunk\\x64\\Release.'
          }

      - name: Test real Windows x64 GUI close and cancellation
        id: windows_ui_smoke
        shell: pwsh
        timeout-minutes: 5
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $reportRoot = Join-Path $artifactRoot 'windows-ui-smoke-x64'
          $exePath = Join-Path $env:GITHUB_WORKSPACE 'trunk/x64/Release/LHash.exe'
          & pwsh -NoProfile -File tests/windows-ui/Invoke-LHashUiSmoke.ps1 -Executable $exePath -ReportDirectory $reportRoot 2>&1 |
            Tee-Object -FilePath (Join-Path $artifactRoot 'windows-ui-smoke-x64.log')
          if ($LASTEXITCODE -ne 0) {
            throw 'Real application GUI smoke failed. See windows-ui-smoke-x64.log and ui-smoke-results.json.'
          }

      - name: Capture the failed owned GUI process stack
        if: ${{ failure() && steps.windows_ui_smoke.outcome == 'failure' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $reportRoot = Join-Path $artifactRoot 'windows-ui-diagnostic-x64'
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE 'build/windows-ui-debug'
          New-Item -ItemType Directory -Force -Path $reportRoot | Out-Null
          & cmake -S tests/windows-ui -B $buildRoot -G 'Visual Studio 17 2022' -A x64 2>&1 |
            Tee-Object -FilePath (Join-Path $reportRoot 'configure.log')
          if ($LASTEXITCODE -ne 0) { throw 'GUI diagnostic driver configure failed.' }
          & cmake --build $buildRoot --config Release --target lhash_windows_crash_driver --parallel 2>&1 |
            Tee-Object -FilePath (Join-Path $reportRoot 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'GUI diagnostic driver build failed.' }
          $driver = Join-Path $buildRoot 'Release/lhash_windows_crash_driver.exe'
          $exePath = Join-Path $env:GITHUB_WORKSPACE 'trunk/x64/Release/LHash.exe'
          # The driver starts only its own child with a minimal environment;
          # signing secrets from this job must not enter the captured process.
          & $driver $exePath $reportRoot 2>&1 |
            Tee-Object -FilePath (Join-Path $reportRoot 'run.log')
          if ($LASTEXITCODE -ne 0) { throw 'The owned GUI diagnostic process failed; inspect crash-stack.txt and run.log.' }
          # The preceding GUI smoke failure remains a failed job even if this
          # diagnostic attempt exits normally. Signing and packaging stay blocked.

      - name: Sign Windows MFC app with PFX certificate (optional)
        if: ${{ env.LHASH_SIGN_PFX_BASE64 != '' && env.LHASH_SIGN_PFX_PASSWORD != '' }}
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $pfxPath = Join-Path $artifactRoot 'windows-signing-cert.pfx'
          $exePath = 'trunk\\x64\\Release\\LHash.exe'

          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:LHASH_SIGN_PFX_BASE64))
          try {
            & powershell -ExecutionPolicy Bypass -File 'trunk/sign_legacy_exe.ps1' -FilePath $exePath -PfxPath $pfxPath -PfxPassword $env:LHASH_SIGN_PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) {
              throw "Windows MFC signing script failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force
            }
          }

      - name: Package Windows x64 build
        if: success()
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $bundleRoot = Join-Path $artifactRoot ("windows-x64-$shortSha")
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          $exeCandidates = @(
            'trunk\x64\Release\LHash.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($exePath) {
            $packagedExe = Join-Path $bundleRoot 'LHash.exe'
            Copy-Item $exePath -Destination $packagedExe -ErrorAction Stop
            $exeHash = (Get-FileHash $packagedExe -Algorithm SHA256).Hash
            $signature = Get-AuthenticodeSignature $packagedExe
            $signatureSubject = ''
            $signatureThumbprint = ''
            if ($signature.SignerCertificate) {
              $signatureSubject = $signature.SignerCertificate.Subject
              $signatureThumbprint = $signature.SignerCertificate.Thumbprint
            }
          $readme = @"
          LHash Windows x64 build

          Commit:
          - $env:GITHUB_SHA

          Files:
          - LHash.exe: desktop application
          - SHA256.txt: executable checksum
          - BUILD_INFO.txt: build metadata

          Usage:
          - Double-click LHash.exe to run the app.
          - 'Publisher unknown' is removed only after the executable is Authenticode-signed with a publicly trusted code-signing identity such as Artifact Signing Public Trust or a trusted CA-issued certificate.
          - Shell extension packaging is intentionally skipped in CI.
          "@

            $buildInfo = @"
          commit=$env:GITHUB_SHA
          short_sha=$shortSha
          source_exe=$exePath
          packaged_exe=LHash.exe
          sha256=$exeHash
          application_version=$([System.Diagnostics.FileVersionInfo]::GetVersionInfo($packagedExe).FileVersion)
          signature_status=$($signature.Status)
          signature_subject=$signatureSubject
          signature_thumbprint=$signatureThumbprint
          openssl_vendor_version=3.5.9
          openssl_vendor_assembly_mode=optimized
          openssl_vendor_target=VC-WIN64A
          openssl_vendor_source=third_party/openssl/3.5.9
          openssl_vendor_static=true
          openssl_vendor_policy=pristine-upstream-source
          openssl_vendor_local_patches=none
          "@

            Set-Content -Path (Join-Path $bundleRoot 'SHA256.txt') -Value ("$exeHash  LHash.exe") -Encoding ASCII
            Set-Content -Path (Join-Path $bundleRoot 'BUILD_INFO.txt') -Value $buildInfo -Encoding ASCII
          }
          else {
            $readme = @"
          LHash Windows x64 build

          The executable was not produced in this CI run.
          See build-windows-x64.log in the artifact root for the full MSBuild output.
          "@
          }

          Set-Content -Path (Join-Path $bundleRoot 'README.txt') -Value $readme -Encoding ASCII

          if ($exePath) {
            Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath (Join-Path $artifactRoot "LHash-windows-x64-$shortSha.zip") -Force
          }

      - name: Upload Windows x64 artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-windows-x64
          path: |
            artifacts/build-openssl-vendor-x64.log
            artifacts/openssl-vendor-x64/*.log
            artifacts/build-windows-x64.log
            artifacts/windows-ui-smoke-x64.log
            artifacts/windows-ui-smoke-x64/**
            artifacts/windows-ui-diagnostic-x64/**
            artifacts/windows-x64-*
            artifacts/LHash-windows-x64-*.zip
          if-no-files-found: warn

  prepare-openssl-vendor-arm64:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify pristine OpenSSL vendor source
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'tools/verify_openssl_vendor_pristine.ps1' -Version 3.5.9

      - name: Restore cached OpenSSL vendor arm64
        id: restore-openssl-vendor-arm64-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/openssl-vendor-arm64
          key: ${{ runner.os }}-openssl-vendor-arm64-optimized-v3-${{ hashFiles('third_party/openssl/3.5.9/**', 'tools/verify_openssl_vendor_pristine.ps1', 'third_party/openssl/OPENSSL_3_5_9_FILES.sha256', 'trunk/build_openssl_vendor.ps1', 'tools/verify_openssl_build_config.pl', 'tools/verify_openssl_install.py', 'NativeOpenSslVendor.targets') }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Prepare OpenSSL arm64 assembler
        uses: ./.github/actions/setup-openssl-assembler
        with:
          platform: ARM64

      - name: Build OpenSSL vendor arm64 once
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $openSslLogPath = Join-Path $artifactRoot 'build-openssl-vendor-arm64.log'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-arm64'

          & pwsh -NoProfile -File 'trunk/build_openssl_vendor.ps1' -Platform ARM64 -AssemblyMode optimized -InstallRoot $openSslRoot -CombinedLogPath $openSslLogPath 2>&1 |
            Tee-Object -FilePath (Join-Path $artifactRoot 'build-openssl-vendor-arm64-console.log')

          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL vendor build failed. See artifacts/build-openssl-vendor-arm64.log for details."
          }

      - name: Verify optimized OpenSSL arm64 build metadata
        shell: pwsh
        run: python tools/verify_openssl_install.py artifacts/openssl-vendor-arm64 optimized VC-WIN64-CLANGASM-ARM

      - name: Annotate OpenSSL build failures
        if: failure()
        shell: pwsh
        run: python tools/report_ci_failures.py artifacts

      - name: Upload OpenSSL vendor arm64 artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-openssl-vendor-arm64
          path: |
            artifacts/build-openssl-vendor-arm64*.log
            artifacts/openssl-vendor-arm64/**
          if-no-files-found: warn

  build-windows-arm64:
    needs:
      - security-regression
      - unit-tests
      - prepare-openssl-vendor-arm64
    runs-on: windows-2022
    env:
      LHASH_SIGN_PFX_BASE64: ${{ secrets.LHASH_SIGN_PFX_BASE64 }}
      LHASH_SIGN_PFX_PASSWORD: ${{ secrets.LHASH_SIGN_PFX_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Download OpenSSL vendor arm64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: LHash-openssl-vendor-arm64
          path: artifacts

      - name: Show Visual Studio toolchain info
        shell: powershell
        run: |
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Unable to locate vswhere.exe on the runner.'
          }

          & $vswhere -latest -products * -format json
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -ErrorAction SilentlyContinue

      - name: Build Windows MFC app
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $logPath = Join-Path $artifactRoot 'build-windows-arm64.log'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-arm64'
          if (-not (Test-Path (Join-Path $openSslRoot 'lib\\libcrypto.lib'))) {
            throw 'Expected the prepared OpenSSL vendor artifact to contain lib\\libcrypto.lib.'
          }

          & msbuild trunk/fileshash15.sln /m /t:LHash /p:Configuration=Release /p:Platform=ARM64 /p:PlatformToolset=v143 /p:LHashOpenSslInstallRoot=$openSslRoot 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE. See artifacts/build-windows-arm64.log for details."
          }

          $exeCandidates = @(
            'trunk\ARM64\Release\LHash.exe'
          )
          $builtExe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $builtExe) {
            throw 'MSBuild succeeded, but no executable was found in trunk\\ARM64\\Release.'
          }

      - name: Sign Windows MFC app with PFX certificate (optional)
        if: ${{ env.LHASH_SIGN_PFX_BASE64 != '' && env.LHASH_SIGN_PFX_PASSWORD != '' }}
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $pfxPath = Join-Path $artifactRoot 'windows-signing-cert.pfx'
          $exePath = 'trunk\\ARM64\\Release\\LHash.exe'

          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:LHASH_SIGN_PFX_BASE64))
          try {
            & powershell -ExecutionPolicy Bypass -File 'trunk/sign_legacy_exe.ps1' -FilePath $exePath -PfxPath $pfxPath -PfxPassword $env:LHASH_SIGN_PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) {
              throw "Windows MFC signing script failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force
            }
          }

      - name: Package Windows ARM64 build
        if: always()
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $bundleRoot = Join-Path $artifactRoot ("windows-arm64-$shortSha")
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          $exeCandidates = @(
            'trunk\ARM64\Release\LHash.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($exePath) {
            $packagedExe = Join-Path $bundleRoot 'LHash.exe'
            Copy-Item $exePath -Destination $packagedExe -ErrorAction Stop
            $exeHash = (Get-FileHash $packagedExe -Algorithm SHA256).Hash
            $signature = Get-AuthenticodeSignature $packagedExe
            $signatureSubject = ''
            $signatureThumbprint = ''
            if ($signature.SignerCertificate) {
              $signatureSubject = $signature.SignerCertificate.Subject
              $signatureThumbprint = $signature.SignerCertificate.Thumbprint
            }
            $readme = @"
          LHash Windows ARM64 build

          Commit:
          - $env:GITHUB_SHA

          Files:
          - LHash.exe: desktop application
          - SHA256.txt: executable checksum
          - BUILD_INFO.txt: build metadata

          Usage:
          - Double-click LHash.exe to run the app.
          - 'Publisher unknown' is removed only after the executable is Authenticode-signed with a publicly trusted code-signing identity such as Artifact Signing Public Trust or a trusted CA-issued certificate.
          - Shell extension packaging is intentionally skipped in CI.
          "@

            $buildInfo = @"
          commit=$env:GITHUB_SHA
          short_sha=$shortSha
          source_exe=$exePath
          packaged_exe=LHash.exe
          sha256=$exeHash
          application_version=$([System.Diagnostics.FileVersionInfo]::GetVersionInfo($packagedExe).FileVersion)
          signature_status=$($signature.Status)
          signature_subject=$signatureSubject
          signature_thumbprint=$signatureThumbprint
          openssl_vendor_version=3.5.9
          openssl_vendor_assembly_mode=optimized
          openssl_vendor_target=VC-WIN64-CLANGASM-ARM
          openssl_vendor_source=third_party/openssl/3.5.9
          openssl_vendor_static=true
          openssl_vendor_policy=pristine-upstream-source
          openssl_vendor_local_patches=none
          "@

            Set-Content -Path (Join-Path $bundleRoot 'SHA256.txt') -Value ("$exeHash  LHash.exe") -Encoding ASCII
            Set-Content -Path (Join-Path $bundleRoot 'BUILD_INFO.txt') -Value $buildInfo -Encoding ASCII
          }
          else {
            $readme = @"
          LHash Windows ARM64 build

          The executable was not produced in this CI run.
          See build-windows-arm64.log in the artifact root for the full MSBuild output.
          "@
          }

          Set-Content -Path (Join-Path $bundleRoot 'README.txt') -Value $readme -Encoding ASCII

          if ($exePath) {
            Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath (Join-Path $artifactRoot "LHash-windows-arm64-$shortSha.zip") -Force
          }

      - name: Upload Windows ARM64 artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-windows-arm64
          path: |
            artifacts/build-openssl-vendor-arm64.log
            artifacts/openssl-vendor-arm64/*.log
            artifacts/build-windows-arm64.log
            artifacts/windows-arm64-*
            artifacts/LHash-windows-arm64-*.zip
          if-no-files-found: warn

  windows-arm64-gui:
    name: Native ARM64 GUI lifecycle
    needs: build-windows-arm64
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download packaged ARM64 application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: LHash-windows-arm64
          path: artifacts/arm64-package

      - name: Verify and test the native ARM64 GUI
        shell: pwsh
        timeout-minutes: 5
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64') {
            throw 'This test requires a native ARM64 operating system.'
          }
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $archives = @(Get-ChildItem (Join-Path $artifactRoot 'arm64-package') -Filter 'LHash-windows-arm64-*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one packaged ARM64 ZIP.' }
          $packageRoot = Join-Path $artifactRoot 'arm64-gui-package'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $packageRoot
          $exePath = Join-Path $packageRoot 'LHash.exe'
          $checksum = (Get-Content (Join-Path $packageRoot 'SHA256.txt') -Raw).Trim()
          if ($checksum -notmatch '^([0-9a-fA-F]{64})  LHash\.exe$') { throw 'Invalid packaged checksum.' }
          $expectedHash = $Matches[1]
          if ((Get-FileHash $exePath -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Packaged executable checksum mismatch.' }
          $metadata = @{}
          foreach ($line in Get-Content (Join-Path $packageRoot 'BUILD_INFO.txt')) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line.Split('=', 2)
            if ($parts.Count -ne 2 -or $metadata.ContainsKey($parts[0])) { throw 'Invalid build metadata.' }
            $metadata[$parts[0]] = $parts[1]
          }
          if ($metadata.commit -ne $env:GITHUB_SHA -or $metadata.sha256 -ne $expectedHash -or
              $metadata.openssl_vendor_version -ne '3.5.9' -or $metadata.openssl_vendor_static -ne 'true' -or
              $metadata.openssl_vendor_assembly_mode -ne 'optimized' -or $metadata.openssl_vendor_target -ne 'VC-WIN64-CLANGASM-ARM' -or
              $metadata.application_version -ne [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exePath).FileVersion) {
            throw 'Packaged executable metadata does not match this commit, version and static OpenSSL build.'
          }
          $stream = [System.IO.File]::OpenRead($exePath)
          $reader = [System.IO.BinaryReader]::new($stream)
          try {
            if ($stream.Length -lt 64 -or $reader.ReadUInt16() -ne 0x5a4d) { throw 'Invalid executable DOS header.' }
            $stream.Position = 0x3c
            $peOffset = $reader.ReadUInt32()
            if ($peOffset -gt $stream.Length - 6) { throw 'Invalid PE header offset.' }
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0xaa64) {
              throw 'The tested executable must be native ARM64, not an emulated x64 application.'
            }
          } finally { $reader.Dispose() }
          & pwsh -NoProfile -File tests/windows-ui/Invoke-LHashUiSmoke.ps1 -Executable $exePath -ReportDirectory (Join-Path $artifactRoot 'windows-ui-smoke-arm64') 2>&1 |
            Tee-Object -FilePath (Join-Path $artifactRoot 'windows-ui-smoke-arm64.log')
          if ($LASTEXITCODE -ne 0) { throw 'Real ARM64 application GUI smoke failed.' }

      - name: Upload native ARM64 GUI results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-ui-smoke-arm64
          path: |
            artifacts/windows-ui-smoke-arm64.log
            artifacts/windows-ui-smoke-arm64/**
          if-no-files-found: warn

  delivery-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify release tooling and upstream integrity
        run: |
          python3 -m unittest discover -s tests/delivery -v
          pwsh -NoProfile -File tools/verify_openssl_vendor_pristine.ps1 -Version 3.5.9

  publish-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-x64
      - build-windows-arm64
      - native-runtime-tests
      - portable-openssl-tests
      - windows-arm64-gui
      - delivery-regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout the exact build commit for release metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download packaged artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: LHash-windows-*
          path: release-assets
          merge-multiple: true

      - name: Stage release rehearsal bundle
        run: python3 tools/release_assets.py stage --assets release-assets --output release-staging

      - name: Scan release assets for a CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-staging
          format: cyclonedx-json
          output-file: release-scan.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize and verify immutable release metadata
        run: |
          python3 tools/release_assets.py finalize --directory release-staging --scan release-scan.cyclonedx.json
          (cd release-staging && sha256sum --check SHA256SUMS.txt)
          tar -czf "LHash-release-rehearsal-${GITHUB_SHA:0:7}.tar.gz" -C release-staging .

      - name: Attest both architecture bundles at the release production point
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release-staging/LHash-windows-*.zip
            release-staging/RELEASE_MANIFEST.txt
            release-staging/SHA256SUMS.txt
            release-staging/LHash-release.cyclonedx.json

      - name: Bind the SBOM to both architecture bundles
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: release-staging/LHash-windows-*.zip
          sbom-path: release-staging/LHash-release.cyclonedx.json

      - name: Upload release rehearsal artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-release-rehearsal
          path: |
            release-staging/RELEASE_MANIFEST.txt
            release-staging/SHA256SUMS.txt
            release-staging/LHash-release.cyclonedx.json
            LHash-release-rehearsal-*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: LHash ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-staging/LHash-windows-x64-*.zip
            release-staging/LHash-windows-arm64-*.zip
            release-staging/RELEASE_MANIFEST.txt
            release-staging/SHA256SUMS.txt
            release-staging/LHash-release.cyclonedx.json
