          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-arm64'

          & powershell -ExecutionPolicy Bypass -File 'trunk/build_openssl_vendor.ps1' -Platform ARM64 -InstallRoot $openSslRoot -CombinedLogPath $openSslLogPath 2>&1 |
            Tee-Object -FilePath $openSslLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL vendor build failed. See artifacts/build-openssl-vendor-arm64.log for details."
          }

      - name: Upload OpenSSL vendor arm64 artifacts
        if: always()
