name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - future-winui-was2
      - codex/**
    tags:
      - v*
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-regression:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build security regression harness
        run: dotnet build security-tests/SecurityRegression/SecurityRegression.csproj --configuration Release

      - name: Run security regression harness
        run: dotnet security-tests/SecurityRegression/bin/Release/net10.0/SecurityRegression.dll

      - name: Build refactor baseline harness
        run: dotnet build refactor-tests/RefactorBaseline/RefactorBaseline.csproj --configuration Release

      - name: Run refactor baseline harness
        run: dotnet refactor-tests/RefactorBaseline/bin/Release/net10.0/RefactorBaseline.dll

  unit-tests:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore unit test project
        run: dotnet restore unit-tests/FHash.UnitTests/FHash.UnitTests.csproj

      - name: Run unit tests
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          & dotnet test unit-tests/FHash.UnitTests/FHash.UnitTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=FHash.UnitTests.trx" --results-directory $artifactRoot

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test failed with exit code $LASTEXITCODE. See artifacts/FHash.UnitTests.trx for details."
          }

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FHash-unit-tests
          path: |
            artifacts/FHash.UnitTests.trx
          if-no-files-found: warn

  native-runtime-tests:
    needs:
      - security-regression
      - unit-tests
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and run native runtime tests
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $buildLogPath = Join-Path $artifactRoot 'build-native-runtime-tests-x64.log'
          $runLogPath = Join-Path $artifactRoot 'run-native-runtime-tests-x64.log'

          & msbuild native-runtime-tests/FHash.NativeRuntimeTests/FHash.NativeRuntimeTests.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:BuildProjectReferences=true 2>&1 |
            Tee-Object -FilePath $buildLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building FHash.NativeRuntimeTests. See artifacts/build-native-runtime-tests-x64.log for details."
          }

          $exePath = 'native-runtime-tests\FHash.NativeRuntimeTests\x64\Release\FHash.NativeRuntimeTests.exe'
          if (-not (Test-Path $exePath)) {
            throw 'Native runtime test executable was not produced in native-runtime-tests\\FHash.NativeRuntimeTests\\x64\\Release.'
          }

          & $exePath 2>&1 | Tee-Object -FilePath $runLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "Native runtime tests failed with exit code $LASTEXITCODE. See artifacts/run-native-runtime-tests-x64.log for details."
          }

      - name: Upload native runtime test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FHash-native-runtime-tests
          path: |
            artifacts/build-native-runtime-tests-x64.log
            artifacts/run-native-runtime-tests-x64.log
          if-no-files-found: warn

  build-legacy-x64:
    needs:
      - security-regression
      - unit-tests
      - native-runtime-tests
    runs-on: windows-2022
    env:
      LHASH_SIGN_PFX_BASE64: ${{ secrets.LHASH_SIGN_PFX_BASE64 }}
      LHASH_SIGN_PFX_PASSWORD: ${{ secrets.LHASH_SIGN_PFX_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show Visual Studio toolchain info
        shell: powershell
        run: |
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Unable to locate vswhere.exe on the runner.'
          }

          & $vswhere -latest -products * -format json
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -ErrorAction SilentlyContinue

      - name: Build legacy Windows app
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $logPath = Join-Path $artifactRoot 'build-legacy-x64.log'

          & msbuild trunk/fileshash15.sln /m /t:fHash /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE. See artifacts/build-legacy-x64.log for details."
          }

          $exeCandidates = @(
            'trunk\x64\Release\LHash.exe'
          )
          $builtExe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $builtExe) {
            throw 'MSBuild succeeded, but no executable was found in trunk\\x64\\Release.'
          }

      - name: Sign legacy Windows app (optional)
        if: ${{ env.LHASH_SIGN_PFX_BASE64 != '' && env.LHASH_SIGN_PFX_PASSWORD != '' }}
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $pfxPath = Join-Path $artifactRoot 'legacy-signing-cert.pfx'
          $exePath = 'trunk\\x64\\Release\\LHash.exe'

          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:LHASH_SIGN_PFX_BASE64))
          try {
            & powershell -ExecutionPolicy Bypass -File 'trunk/sign_legacy_exe.ps1' -FilePath $exePath -PfxPath $pfxPath -PfxPassword $env:LHASH_SIGN_PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) {
              throw "Legacy signing script failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force
            }
          }

      - name: Package legacy x64 build
        if: always()
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $bundleRoot = Join-Path $artifactRoot ("legacy-x64-$shortSha")
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          $exeCandidates = @(
            'trunk\x64\Release\LHash.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($exePath) {
            $packagedExe = Join-Path $bundleRoot 'LHash.exe'
            Copy-Item $exePath -Destination $packagedExe -ErrorAction Stop
            $exeHash = (Get-FileHash $packagedExe -Algorithm SHA256).Hash
            $signature = Get-AuthenticodeSignature $packagedExe
            $signatureSubject = ''
            $signatureThumbprint = ''
            if ($signature.SignerCertificate) {
              $signatureSubject = $signature.SignerCertificate.Subject
              $signatureThumbprint = $signature.SignerCertificate.Thumbprint
            }
            $readme = @"
          LHash legacy x64 build

          Commit:
          - $env:GITHUB_SHA

          Files:
          - LHash.exe: desktop application
          - SHA256.txt: executable checksum
          - BUILD_INFO.txt: build metadata

          Usage:
          - Double-click LHash.exe to run the app.
          - 'Publisher unknown' is removed only after the executable is Authenticode-signed with a trusted code-signing certificate.
          - Shell extension packaging is intentionally skipped in CI.
          "@

            $buildInfo = @"
          commit=$env:GITHUB_SHA
          short_sha=$shortSha
          source_exe=$exePath
          packaged_exe=LHash.exe
          sha256=$exeHash
          signature_status=$($signature.Status)
          signature_subject=$signatureSubject
          signature_thumbprint=$signatureThumbprint
          "@

            Set-Content -Path (Join-Path $bundleRoot 'SHA256.txt') -Value ("$exeHash  LHash.exe") -Encoding ASCII
            Set-Content -Path (Join-Path $bundleRoot 'BUILD_INFO.txt') -Value $buildInfo -Encoding ASCII
          }
          else {
            $readme = @"
          LHash legacy x64 build

          The executable was not produced in this CI run.
          See build-legacy-x64.log in the artifact root for the full MSBuild output.
          "@
          }

          Set-Content -Path (Join-Path $bundleRoot 'README.txt') -Value $readme -Encoding ASCII

          if ($exePath) {
            Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath (Join-Path $artifactRoot "LHash-legacy-x64-$shortSha.zip") -Force
          }

      - name: Upload legacy x64 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHash-legacy-x64
          path: |
            artifacts/build-legacy-x64.log
            artifacts/legacy-x64-*
            artifacts/LHash-legacy-x64-*.zip
          if-no-files-found: warn

  build-winui-bridge-x64:
    needs:
      - security-regression
      - unit-tests
      - native-runtime-tests
    runs-on: windows-2022
    env:
      LHASH_SIGN_PFX_BASE64: ${{ secrets.LHASH_SIGN_PFX_BASE64 }}
      LHASH_SIGN_PFX_PASSWORD: ${{ secrets.LHASH_SIGN_PFX_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and publish WinUI desktop app
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $coreLogPath = Join-Path $artifactRoot 'build-native-core-x64.log'
          $nativeLogPath = Join-Path $artifactRoot 'build-winui-native-x64.log'
          $bridgeLogPath = Join-Path $artifactRoot 'build-winui-bridge-x64.log'
          $publishLogPath = Join-Path $artifactRoot 'publish-winui-x64.log'
          $publishRoot = Join-Path $artifactRoot 'winui-desktop-publish'
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null

          & msbuild sub-proj/fHashNativeCore/fHashNativeCore.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:FHashDynamicRuntime=true 2>&1 |
            Tee-Object -FilePath $coreLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashNativeCore. See artifacts/build-native-core-x64.log for details."
          }

          & msbuild sub-proj/fHashWUINative/fHashWUINative.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $nativeLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashWUINative. See artifacts/build-winui-native-x64.log for details."
          }

          & msbuild sub-proj/fHashClrBridge/fHashClrBridge.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $bridgeLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashClrBridge. See artifacts/build-winui-bridge-x64.log for details."
          }

          & msbuild trunk/source/WinUI/fHashWUI.csproj /restore /m /t:Publish /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:RuntimeIdentifier=win-x64 /p:PublishProfile=win10-x64 "/p:PublishDir=$publishRoot\\" 2>&1 |
            Tee-Object -FilePath $publishLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while publishing the WinUI desktop app. See artifacts/publish-winui-x64.log for details."
          }

          $publishedExe = Get-ChildItem -Path $publishRoot -Filter 'LHash.exe' -Recurse -ErrorAction Stop | Select-Object -First 1
          if (-not $publishedExe) {
            throw 'WinUI publish completed, but LHash.exe was not found in the publish output.'
          }

      - name: Sign WinUI desktop app (optional)
        if: ${{ env.LHASH_SIGN_PFX_BASE64 != '' && env.LHASH_SIGN_PFX_PASSWORD != '' }}
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $pfxPath = Join-Path $artifactRoot 'winui-signing-cert.pfx'
          $publishRoot = Join-Path $artifactRoot 'winui-desktop-publish'
          $exePath = (Get-ChildItem -Path $publishRoot -Filter 'LHash.exe' -Recurse -ErrorAction Stop | Select-Object -First 1).FullName

          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:LHASH_SIGN_PFX_BASE64))
          try {
            & powershell -ExecutionPolicy Bypass -File 'trunk/sign_legacy_exe.ps1' -FilePath $exePath -PfxPath $pfxPath -PfxPassword $env:LHASH_SIGN_PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) {
              throw "WinUI signing script failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force
            }
          }

      - name: Package WinUI desktop x64 build
        if: always()
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $publishRoot = Join-Path $artifactRoot 'winui-desktop-publish'
          $bundleRoot = Join-Path $artifactRoot ("winui-x64-$shortSha")
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          $publishedExe = Get-ChildItem -Path $publishRoot -Filter 'LHash.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($publishedExe) {
            Copy-Item (Join-Path $publishRoot '*') -Destination $bundleRoot -Recurse -Force -ErrorAction Stop

            $packagedExe = Join-Path $bundleRoot 'LHash.exe'
            $exeHash = (Get-FileHash $packagedExe -Algorithm SHA256).Hash
            $signature = Get-AuthenticodeSignature $packagedExe
            $signatureSubject = ''
            $signatureThumbprint = ''
            if ($signature.SignerCertificate) {
              $signatureSubject = $signature.SignerCertificate.Subject
              $signatureThumbprint = $signature.SignerCertificate.Thumbprint
            }
            $readme = @"
          LHash WinUI desktop x64 build

          Commit:
          - $env:GITHUB_SHA

          Files:
          - LHash.exe: official unpackaged WinUI desktop application
          - SHA256.txt: executable checksum
          - BUILD_INFO.txt: build metadata

          Usage:
          - Extract the zip and run LHash.exe.
          - This package is the official WinUI desktop release line.
          - 'Publisher unknown' is removed only after the executable is Authenticode-signed with a trusted code-signing certificate.
          - Shell extension packaging is intentionally skipped in CI.
          "@

            $buildInfo = @"
          commit=$env:GITHUB_SHA
          short_sha=$shortSha
          frontend=winui-desktop
          source_project=trunk/source/WinUI/fHashWUI.csproj
          packaged_exe=LHash.exe
          sha256=$exeHash
          signature_status=$($signature.Status)
          signature_subject=$signatureSubject
          signature_thumbprint=$signatureThumbprint
          "@

            Set-Content -Path (Join-Path $bundleRoot 'SHA256.txt') -Value ("$exeHash  LHash.exe") -Encoding ASCII
            Set-Content -Path (Join-Path $bundleRoot 'BUILD_INFO.txt') -Value $buildInfo -Encoding ASCII
          }
          else {
            $readme = @"
          LHash WinUI desktop x64 build

          The WinUI desktop executable was not produced in this CI run.
          See publish-winui-x64.log in the artifact root for the full MSBuild output.
          "@
          }

          Set-Content -Path (Join-Path $bundleRoot 'README.txt') -Value $readme -Encoding ASCII

          if ($publishedExe) {
            Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath (Join-Path $artifactRoot "LHash-winui-x64-$shortSha.zip") -Force
          }

      - name: Upload WinUI desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHash-winui-x64
          path: |
            artifacts/build-native-core-x64.log
            artifacts/build-winui-native-x64.log
            artifacts/build-winui-bridge-x64.log
            artifacts/publish-winui-x64.log
            artifacts/winui-x64-*
            artifacts/LHash-winui-x64-*.zip
          if-no-files-found: warn

  build-uwp-bridge-x64:
    needs:
      - security-regression
      - unit-tests
      - native-runtime-tests
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build UWP native and WinRT bridge
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $nativeLogPath = Join-Path $artifactRoot 'build-uwp-native-x64.log'
          $bridgeLogPath = Join-Path $artifactRoot 'build-uwp-bridge-x64.log'

          & msbuild sub-proj/fHashUwpNative/fHashUwpNative.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $nativeLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashUwpNative. See artifacts/build-uwp-native-x64.log for details."
          }

          & msbuild sub-proj/fHashWinRtBridge/fHashWinRtBridge.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $bridgeLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashWinRtBridge. See artifacts/build-uwp-bridge-x64.log for details."
          }

      - name: Upload UWP bridge artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHash-UWP-bridge-x64
          path: |
            artifacts/build-uwp-native-x64.log
            artifacts/build-uwp-bridge-x64.log
          if-no-files-found: warn

  build-wui-shell-ext-x64:
    needs:
      - security-regression
      - unit-tests
      - native-runtime-tests
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build WinUI shell extension
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $logPath = Join-Path $artifactRoot 'build-wui-shell-ext-x64.log'

          & msbuild sub-proj/fHashWUIShellExt/fHashWUIShellExt.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashWUIShellExt. See artifacts/build-wui-shell-ext-x64.log for details."
          }

      - name: Upload WinUI shell extension artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHash-WinUI-shell-ext-x64
          path: |
            artifacts/build-wui-shell-ext-x64.log
          if-no-files-found: warn

  build-uwp-shell-ext-x64:
    needs:
      - security-regression
      - unit-tests
      - native-runtime-tests
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build UWP shell extension
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $logPath = Join-Path $artifactRoot 'build-uwp-shell-ext-x64.log'

          & msbuild sub-proj/fHashUwpShellExt/fHashUwpShellExt.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashUwpShellExt. See artifacts/build-uwp-shell-ext-x64.log for details."
          }

      - name: Upload UWP shell extension artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHash-UWP-shell-ext-x64
          path: |
            artifacts/build-uwp-shell-ext-x64.log
          if-no-files-found: warn

  publish-release:
    if: github.event_name != 'pull_request'
    needs:
      - build-winui-bridge-x64
      - build-uwp-bridge-x64
      - build-wui-shell-ext-x64
      - build-uwp-shell-ext-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LHash-*
          path: release-assets
          merge-multiple: true

      - name: Stage release rehearsal bundle
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="$PWD/release-assets"
          staging_root="$PWD/release-staging"
          mkdir -p "$staging_root"

          if ! compgen -G "$artifact_root/LHash-winui-x64-*.zip" > /dev/null; then
            echo "Expected packaged WinUI desktop release zip was not downloaded into release-assets." >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          release_mode="rehearsal"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_mode="tagged-release"
          fi

          cat > "$staging_root/RELEASE_MANIFEST.txt" <<EOF
          release_mode=$release_mode
          ref=$GITHUB_REF
          commit=$GITHUB_SHA
          short_sha=$short_sha
          frontend=winui-desktop
          workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          desktop_bundle=$(basename $(ls "$artifact_root"/LHash-winui-x64-*.zip | head -n 1))
          EOF

          cp "$artifact_root"/LHash-winui-x64-*.zip "$staging_root"/
          find "$artifact_root" -maxdepth 1 -type f \( -name '*.log' -o -name '*.txt' \) -exec cp {} "$staging_root"/ \;
          tar -czf "$PWD/LHash-release-rehearsal-$short_sha.tar.gz" -C "$staging_root" .

      - name: Upload release rehearsal artifact
        uses: actions/upload-artifact@v4
        with:
          name: LHash-release-rehearsal
          path: |
            release-staging/RELEASE_MANIFEST.txt
            LHash-release-rehearsal-*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LHash ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/LHash-winui-x64-*.zip
            release-staging/RELEASE_MANIFEST.txt

