        uses: actions/checkout@v5

      - name: Verify pristine OpenSSL vendor source
        shell: powershell
        run: |
          & powershell -ExecutionPolicy Bypass -File 'tools/verify_openssl_vendor_pristine.ps1' -Version 3.5.6

      - name: Restore cached OpenSSL vendor arm64
