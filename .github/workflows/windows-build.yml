name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - future-winui-was2
    tags:
      - v*
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-regression:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build security regression harness
        run: dotnet build security-tests/SecurityRegression/SecurityRegression.csproj --configuration Release

      - name: Run security regression harness
        run: dotnet security-tests/SecurityRegression/bin/Release/net10.0/SecurityRegression.dll

      - name: Build refactor baseline harness
        run: dotnet build refactor-tests/RefactorBaseline/RefactorBaseline.csproj --configuration Release

      - name: Run refactor baseline harness
        run: dotnet refactor-tests/RefactorBaseline/bin/Release/net10.0/RefactorBaseline.dll

  unit-tests:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore unit test project
        run: dotnet restore unit-tests/LHash.UnitTests/LHash.UnitTests.csproj

      - name: Run unit tests
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          & dotnet test unit-tests/LHash.UnitTests/LHash.UnitTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=LHash.UnitTests.trx" --results-directory $artifactRoot

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test failed with exit code $LASTEXITCODE. See artifacts/LHash.UnitTests.trx for details."
          }

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LHash-unit-tests
          path: |
            artifacts/LHash.UnitTests.trx
          if-no-files-found: warn

  prepare-openssl-vendor-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify pristine OpenSSL vendor source
        shell: powershell
        run: |
          & powershell -ExecutionPolicy Bypass -File 'tools/verify_openssl_vendor_pristine.ps1' -Version 3.5.6

      - name: Restore cached OpenSSL vendor x64
        id: restore-openssl-vendor-x64-cache
        uses: actions/cache@v4
        with:
          path: artifacts/openssl-vendor-x64
          key: ${{ runner.os }}-openssl-vendor-x64-v2-${{ hashFiles('third_party/openssl/3.5.6/**', 'tools/verify_openssl_vendor_pristine.ps1', 'trunk/build_openssl_vendor.ps1', 'NativeOpenSslVendor.targets') }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build OpenSSL vendor x64 once
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $openSslLogPath = Join-Path $artifactRoot 'build-openssl-vendor-x64.log'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-x64'

          & powershell -ExecutionPolicy Bypass -File 'trunk/build_openssl_vendor.ps1' -Platform x64 -InstallRoot $openSslRoot -CombinedLogPath $openSslLogPath 2>&1 |
            Tee-Object -FilePath $openSslLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL vendor build failed. See artifacts/build-openssl-vendor-x64.log for details."
          }

      - name: Upload OpenSSL vendor x64 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LHash-openssl-vendor-x64
          path: |
            artifacts/build-openssl-vendor-x64.log
            artifacts/openssl-vendor-x64/**
          if-no-files-found: warn

  native-runtime-tests:
    needs:
      - security-regression
      - unit-tests
      - prepare-openssl-vendor-x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download OpenSSL vendor x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: LHash-openssl-vendor-x64
          path: artifacts

      - name: Build and run native runtime tests
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $buildLogPath = Join-Path $artifactRoot 'build-native-runtime-tests-x64.log'
          $runLogPath = Join-Path $artifactRoot 'run-native-runtime-tests-x64.log'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-x64'
          if (-not (Test-Path (Join-Path $openSslRoot 'lib\\libcrypto.lib'))) {
            throw 'Expected the prepared OpenSSL vendor artifact to contain lib\\libcrypto.lib.'
          }

          & msbuild native-runtime-tests/LHash.NativeRuntimeTests/LHash.NativeRuntimeTests.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:BuildProjectReferences=true /p:LHashOpenSslInstallRoot=$openSslRoot 2>&1 |
            Tee-Object -FilePath $buildLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building LHash.NativeRuntimeTests. See artifacts/build-native-runtime-tests-x64.log for details."
          }

          $exePath = 'native-runtime-tests\LHash.NativeRuntimeTests\x64\Release\LHash.NativeRuntimeTests.exe'
          if (-not (Test-Path $exePath)) {
            throw 'Native runtime test executable was not produced in native-runtime-tests\\LHash.NativeRuntimeTests\\x64\\Release.'
          }

          & $exePath 2>&1 | Tee-Object -FilePath $runLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "Native runtime tests failed with exit code $LASTEXITCODE. See artifacts/run-native-runtime-tests-x64.log for details."
          }

      - name: Upload native runtime test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LHash-native-runtime-tests
          path: |
            artifacts/build-openssl-vendor-x64.log
            artifacts/openssl-vendor-x64/*.log
            artifacts/build-native-runtime-tests-x64.log
            artifacts/run-native-runtime-tests-x64.log
          if-no-files-found: warn

  build-windows-x64:
    needs:
      - security-regression
      - unit-tests
      - prepare-openssl-vendor-x64
    runs-on: windows-2022
    env:
      LHASH_SIGN_PFX_BASE64: ${{ secrets.LHASH_SIGN_PFX_BASE64 }}
      LHASH_SIGN_PFX_PASSWORD: ${{ secrets.LHASH_SIGN_PFX_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download OpenSSL vendor x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: LHash-openssl-vendor-x64
          path: artifacts

      - name: Show Visual Studio toolchain info
        shell: powershell
        run: |
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Unable to locate vswhere.exe on the runner.'
          }

          & $vswhere -latest -products * -format json
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -ErrorAction SilentlyContinue

      - name: Build Windows MFC app
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $logPath = Join-Path $artifactRoot 'build-windows-x64.log'
          $openSslRoot = Join-Path $artifactRoot 'openssl-vendor-x64'
          if (-not (Test-Path (Join-Path $openSslRoot 'lib\\libcrypto.lib'))) {
            throw 'Expected the prepared OpenSSL vendor artifact to contain lib\\libcrypto.lib.'
          }

          & msbuild trunk/fileshash15.sln /m /t:LHash /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:LHashOpenSslInstallRoot=$openSslRoot 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE. See artifacts/build-windows-x64.log for details."
          }

          $exeCandidates = @(
            'trunk\x64\Release\LHash.exe'
          )
          $builtExe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $builtExe) {
            throw 'MSBuild succeeded, but no executable was found in trunk\\x64\\Release.'
          }

      - name: Sign Windows MFC app with PFX certificate (optional)
        if: ${{ env.LHASH_SIGN_PFX_BASE64 != '' && env.LHASH_SIGN_PFX_PASSWORD != '' }}
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $pfxPath = Join-Path $artifactRoot 'windows-signing-cert.pfx'
          $exePath = 'trunk\\x64\\Release\\LHash.exe'

          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:LHASH_SIGN_PFX_BASE64))
          try {
            & powershell -ExecutionPolicy Bypass -File 'trunk/sign_legacy_exe.ps1' -FilePath $exePath -PfxPath $pfxPath -PfxPassword $env:LHASH_SIGN_PFX_PASSWORD
            if ($LASTEXITCODE -ne 0) {
              throw "Windows MFC signing script failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force
            }
          }

      - name: Package Windows x64 build
        if: always()
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $bundleRoot = Join-Path $artifactRoot ("windows-x64-$shortSha")
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          $exeCandidates = @(
            'trunk\x64\Release\LHash.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($exePath) {
            $packagedExe = Join-Path $bundleRoot 'LHash.exe'
            Copy-Item $exePath -Destination $packagedExe -ErrorAction Stop
            $exeHash = (Get-FileHash $packagedExe -Algorithm SHA256).Hash
            $signature = Get-AuthenticodeSignature $packagedExe
            $signatureSubject = ''
            $signatureThumbprint = ''
            if ($signature.SignerCertificate) {
              $signatureSubject = $signature.SignerCertificate.Subject
              $signatureThumbprint = $signature.SignerCertificate.Thumbprint
            }
          $readme = @"
          LHash Windows x64 build

          Commit:
          - $env:GITHUB_SHA

          Files:
          - LHash.exe: desktop application
          - SHA256.txt: executable checksum
          - BUILD_INFO.txt: build metadata

          Usage:
          - Double-click LHash.exe to run the app.
          - 'Publisher unknown' is removed only after the executable is Authenticode-signed with a publicly trusted code-signing identity such as Artifact Signing Public Trust or a trusted CA-issued certificate.
          - Shell extension packaging is intentionally skipped in CI.
          "@

            $buildInfo = @"
          commit=$env:GITHUB_SHA
          short_sha=$shortSha
          source_exe=$exePath
          packaged_exe=LHash.exe
          sha256=$exeHash
          signature_status=$($signature.Status)
          signature_subject=$signatureSubject
          signature_thumbprint=$signatureThumbprint
          openssl_vendor_version=3.5.6
          openssl_vendor_source=third_party/openssl/3.5.6
          openssl_vendor_static=true
          openssl_vendor_policy=pristine-upstream-source
          openssl_vendor_local_patches=none
          "@

            Set-Content -Path (Join-Path $bundleRoot 'SHA256.txt') -Value ("$exeHash  LHash.exe") -Encoding ASCII
            Set-Content -Path (Join-Path $bundleRoot 'BUILD_INFO.txt') -Value $buildInfo -Encoding ASCII
          }
          else {
            $readme = @"
          LHash Windows x64 build

          The executable was not produced in this CI run.
          See build-windows-x64.log in the artifact root for the full MSBuild output.
          "@
          }

          Set-Content -Path (Join-Path $bundleRoot 'README.txt') -Value $readme -Encoding ASCII

          if ($exePath) {
            Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath (Join-Path $artifactRoot "LHash-windows-x64-$shortSha.zip") -Force
          }

      - name: Upload Windows x64 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LHash-windows-x64
          path: |
            artifacts/build-openssl-vendor-x64.log
            artifacts/openssl-vendor-x64/*.log
            artifacts/build-windows-x64.log
            artifacts/windows-x64-*
            artifacts/LHash-windows-x64-*.zip
          if-no-files-found: warn

  prepare-openssl-vendor-arm64:
    runs-on: windows-2022

    steps:
