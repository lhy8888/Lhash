name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - future-winui-was2
      - codex/**
    tags:
      - v*
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-regression:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build security regression harness
        run: dotnet build security-tests/SecurityRegression/SecurityRegression.csproj --configuration Release

      - name: Run security regression harness
        run: dotnet security-tests/SecurityRegression/bin/Release/net10.0/SecurityRegression.dll

      - name: Build refactor baseline harness
        run: dotnet build refactor-tests/RefactorBaseline/RefactorBaseline.csproj --configuration Release

      - name: Run refactor baseline harness
        run: dotnet refactor-tests/RefactorBaseline/bin/Release/net10.0/RefactorBaseline.dll

  build-legacy-x64:
    needs: security-regression
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show Visual Studio toolchain info
        shell: powershell
        run: |
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Unable to locate vswhere.exe on the runner.'
          }

          & $vswhere -latest -products * -format json
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -ErrorAction SilentlyContinue

      - name: Build legacy Windows app
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $logPath = Join-Path $artifactRoot 'build-legacy-x64.log'

          & msbuild trunk/fileshash15.sln /m /t:fHash /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE. See artifacts/build-legacy-x64.log for details."
          }

          $exeCandidates = @(
            'trunk\x64\Release\LHash.exe'
          )
          $builtExe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $builtExe) {
            throw 'MSBuild succeeded, but no executable was found in trunk\\x64\\Release.'
          }

      - name: Package legacy x64 build
        if: always()
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $bundleRoot = Join-Path $artifactRoot ("legacy-x64-$shortSha")
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          $exeCandidates = @(
            'trunk\x64\Release\LHash.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($exePath) {
            $packagedExe = Join-Path $bundleRoot 'LHash.exe'
            Copy-Item $exePath -Destination $packagedExe -ErrorAction Stop
            $exeHash = (Get-FileHash $packagedExe -Algorithm SHA256).Hash
            $readme = @"
          LHash legacy x64 build

          Commit:
          - $env:GITHUB_SHA

          Files:
          - LHash.exe: desktop application
          - SHA256.txt: executable checksum
          - BUILD_INFO.txt: build metadata

          Usage:
          - Double-click LHash.exe to run the app.
          - Shell extension packaging is intentionally skipped in CI.
          "@

            $buildInfo = @"
          commit=$env:GITHUB_SHA
          short_sha=$shortSha
          source_exe=$exePath
          packaged_exe=LHash.exe
          sha256=$exeHash
          "@

            Set-Content -Path (Join-Path $bundleRoot 'SHA256.txt') -Value ("$exeHash  LHash.exe") -Encoding ASCII
            Set-Content -Path (Join-Path $bundleRoot 'BUILD_INFO.txt') -Value $buildInfo -Encoding ASCII
          }
          else {
            $readme = @"
          LHash legacy x64 build

          The executable was not produced in this CI run.
          See build-legacy-x64.log in the artifact root for the full MSBuild output.
          "@
          }

          Set-Content -Path (Join-Path $bundleRoot 'README.txt') -Value $readme -Encoding ASCII

          if ($exePath) {
            Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath (Join-Path $artifactRoot "LHash-legacy-x64-$shortSha.zip") -Force
          }

      - name: Upload legacy x64 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHash-legacy-x64
          path: |
            artifacts/build-legacy-x64.log
            artifacts/legacy-x64-*
            artifacts/LHash-legacy-x64-*.zip
          if-no-files-found: warn

  build-winui-bridge-x64:
    needs: security-regression
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore WinUI CLR bridge packages
        shell: powershell
        run: dotnet restore sub-proj/fHashClrBridge/fHashClrBridge.vcxproj

      - name: Build WinUI native and CLR bridge
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $nativeLogPath = Join-Path $artifactRoot 'build-winui-native-x64.log'
          $bridgeLogPath = Join-Path $artifactRoot 'build-winui-bridge-x64.log'

          & msbuild sub-proj/fHashWUINative/fHashWUINative.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $nativeLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashWUINative. See artifacts/build-winui-native-x64.log for details."
          }

          & msbuild sub-proj/fHashClrBridge/fHashClrBridge.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $bridgeLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashClrBridge. See artifacts/build-winui-bridge-x64.log for details."
          }

      - name: Upload WinUI bridge artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHash-WinUI-bridge-x64
          path: |
            artifacts/build-winui-native-x64.log
            artifacts/build-winui-bridge-x64.log
          if-no-files-found: warn

  build-uwp-bridge-x64:
    needs: security-regression
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build UWP native and WinRT bridge
        shell: powershell
        run: |
          $artifactRoot = Join-Path $pwd 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $nativeLogPath = Join-Path $artifactRoot 'build-uwp-native-x64.log'
          $bridgeLogPath = Join-Path $artifactRoot 'build-uwp-bridge-x64.log'

          & msbuild sub-proj/fHashUwpNative/fHashUwpNative.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $nativeLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashUwpNative. See artifacts/build-uwp-native-x64.log for details."
          }

          & msbuild sub-proj/fHashWinRtBridge/fHashWinRtBridge.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 |
            Tee-Object -FilePath $bridgeLogPath

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed while building fHashWinRtBridge. See artifacts/build-uwp-bridge-x64.log for details."
          }

      - name: Upload UWP bridge artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHash-UWP-bridge-x64
          path: |
            artifacts/build-uwp-native-x64.log
            artifacts/build-uwp-bridge-x64.log
          if-no-files-found: warn

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-legacy-x64
      - build-winui-bridge-x64
      - build-uwp-bridge-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download legacy x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: LHash-legacy-x64
          path: release-assets

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/LHash-legacy-x64-*.zip

