name: macOS ARM64 App and CLI Build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - future-winui-was2
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  build-macos-arm64-cli:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      LHASH_UI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/mac-cli/gui
      OPENSSL_ROOT_DIR: ${{ github.workspace }}/build/openssl-install

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify pristine OpenSSL source
        run: pwsh -NoProfile -File tools/verify_openssl_vendor_pristine.ps1 -Version 3.5.9

      - name: Cache static OpenSSL
        id: openssl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/openssl-install
          key: openssl-3.5.9-macos-cli-arm64-optimized-${{ hashFiles('third_party/openssl/3.5.9/**', 'third_party/openssl/OPENSSL_3_5_9_FILES.sha256', 'tools/build_openssl_vendor_posix.sh', 'tools/verify_openssl_build_config.pl', 'tools/verify_openssl_install.py') }}

      - name: Build static OpenSSL 3.5.9
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: bash tools/build_openssl_vendor_posix.sh "$OPENSSL_ROOT_DIR" optimized

      - name: Verify optimized OpenSSL configuration
        run: |
          python3 tools/verify_openssl_install.py "$OPENSSL_ROOT_DIR" optimized darwin64-arm64-cc
          mkdir -p artifacts/mac-cli
          cp "$OPENSSL_ROOT_DIR/lhash-openssl-build-config.json" artifacts/mac-cli/

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build/macos-cli \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLHASH_BUILD_M2_SMOKE=OFF \
            -DLHASH_BUILD_RUNTIME_TESTS=ON \
            -DLHASH_BUILD_CLI=ON \
            -DLHASH_BUILD_MACOS_GUI=ON \
            -DLHASH_ENABLE_OPENSSL_VENDOR=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" 2>&1 | tee artifacts/mac-cli/configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build/macos-cli \
            --config Release --parallel 2>&1 | tee artifacts/mac-cli/build.log

      - name: Locate executable
        run: |
          CLI_PATH="$(find build/macos-cli -type f -name lhash | head -n 1)"
          if [ -z "$CLI_PATH" ]; then
            echo "lhash executable not found" && exit 1
          fi
          echo "CLI_PATH=${CLI_PATH}" >> "$GITHUB_ENV"

      - name: Test engine, CLI algorithms and native AppKit interface
        run: |
          set -o pipefail
          mkdir -p "$LHASH_UI_ARTIFACT_DIR"
          ctest --test-dir build/macos-cli --output-on-failure --no-tests=error -V \
            --output-junit "$GITHUB_WORKSPACE/artifacts/mac-cli/runtime.xml" 2>&1 | tee artifacts/mac-cli/runtime-tests.log
          "$CLI_PATH" --list-algorithms

      - name: Annotate CLI test failures
        if: failure()
        run: python3 tools/report_ci_failures.py artifacts/mac-cli

      - name: Upload CLI test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-macos-arm64-cli-tests
          path: artifacts/mac-cli/**
          if-no-files-found: warn

      - name: Package
        run: |
          SHA=${GITHUB_SHA:0:7}
          APPLICATION_VERSION=$(python3 "$GITHUB_WORKSPACE/tools/release_assets.py" version --repo "$GITHUB_WORKSPACE")
          DIR="LHash-macos-arm64-cli-${SHA}"
          mkdir -p "dist/${DIR}"
          cp "$CLI_PATH" "dist/${DIR}/"
          (cd "dist/${DIR}" && shasum -a 256 lhash > SHA256.txt)
          cat > "dist/${DIR}/README.txt" <<EOF
          LHash macOS ARM64 CLI

          Version:
          - $APPLICATION_VERSION

          Commit:
          - $GITHUB_SHA

          Files:
          - lhash: command-line executable
          - SHA256.txt: executable checksum
          - BUILD_INFO.txt: build metadata

          Usage:
          - ./lhash <file>
          - ./lhash -a sha256 <file>
          - ./lhash --list-algorithms
          - ./lhash --all <file>
          - shasum -a 256 -c SHA256.txt
          - This package is unsigned and is not notarized.
          EOF
          cat > "dist/${DIR}/BUILD_INFO.txt" <<EOF
          commit=$GITHUB_SHA
          short_sha=$SHA
          ref=$GITHUB_REF
          application_version=$APPLICATION_VERSION
          platform=macos-arm64
          artifact_type=cli
          openssl_enabled=true
          openssl_vendor_version=3.5.9
          openssl_vendor_assembly_mode=optimized
          openssl_vendor_target=darwin64-arm64-cc
          notarized=false
          source_executable=$CLI_PATH
          packaged_executable=lhash
          sha256=$(cut -d ' ' -f 1 "dist/${DIR}/SHA256.txt")
          EOF
          tar -czf "dist/${DIR}.tar.gz" -C dist "${DIR}"
          verification_root=$(mktemp -d)
          trap 'rm -rf "$verification_root"' EXIT
          tar -xzf "dist/${DIR}.tar.gz" -C "$verification_root"
          (cd "$verification_root/${DIR}" && shasum -a 256 -c SHA256.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-macos-arm64-cli
          path: dist/LHash-macos-arm64-cli-*.tar.gz
          if-no-files-found: error

      - name: Sign and package macOS application
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/macos-cli/bin/LHash.app"
          codesign --force --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          python3 tools/package_macos_app.py --app "$APP_PATH" --output dist
          verification_root=$(mktemp -d)
          trap 'rm -rf "$verification_root"' EXIT
          package="LHash-macos-arm64-app-${GITHUB_SHA:0:7}"
          ditto -x -k "dist/$package.zip" "$verification_root"
          (cd "$verification_root/$package" && shasum -a 256 -c SHA256.txt)
          test -x "$verification_root/$package/LHash.app/Contents/MacOS/LHash"
          codesign --verify --deep --strict --verbose=2 "$verification_root/$package/LHash.app"

      - name: Upload application artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LHash-macos-arm64-app
          path: dist/LHash-macos-arm64-app-*.zip
          if-no-files-found: error
